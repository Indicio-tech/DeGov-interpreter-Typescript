name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: yarn
      - name: Verify tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "refs/tags/v${version}" != "${GITHUB_REF}" ]; then
            echo "Tag ${GITHUB_REF} does not match package.json version v${version}" >&2
            exit 1
          fi
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn build
      - run: yarn audit --groups dependencies --level high
      - name: Pack
        run: |
          npm pack
          sha256sum ./*.tgz | tee checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            *.tgz
            checksums.txt
          retention-days: 30

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Configure required reviewers on the "release" environment to gate publishing.
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Publish the tested tarball
        run: npm publish ./*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Create GitHub Release with tarball and checksum
        run: gh release create "${GITHUB_REF_NAME}" ./*.tgz checksums.txt --repo "${GITHUB_REPOSITORY}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
